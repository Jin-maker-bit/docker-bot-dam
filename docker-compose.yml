version: '3.8'

networks:
  bot-net:
    driver: bridge

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n # ◄ CAMBIADO: Ahora es un volumen nombrado
    networks:
      - bot-net

  openhands:
    image: ghcr.io/all-hands-ai/openhands:main
    container_name: openhands
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SANDBOX_TYPE=local
      - WORKSPACE_BASE=/opt/workspace_base
      - LLM_MODEL=groq/llama3-8b-8192           
      - LLM_API_KEY=gsk__TU_API_KEY_DE_GROQ_AQUÍ
    volumes:
      - openhands_workspace:/opt/workspace_base # ◄ CAMBIADO: Volumen nombrado
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bot-net

volumes: # ◄ NUEVA SECCIÓN OBLIGATORIA al final del archivo
  n8n_data:
  openhands_workspace: