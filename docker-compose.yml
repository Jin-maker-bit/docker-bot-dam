networks:
  bot-net:
    driver: bridge

services:
  n8n:
    build: .
    container_name: n8n
    restart: unless-stopped
    user: root
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://broom-broadside-vaguely.ngrok-free.dev/
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bot-net

  openhands:
    image: ghcr.io/all-hands-ai/openhands:main
    container_name: openhands
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SANDBOX_TYPE=local
      - WORKSPACE_BASE=/opt/workspace_base
      - LLM_MODEL=groq/llama3-8b-8192
      - LLM_API_KEY=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
    volumes:
      - openhands_workspace:/opt/workspace_base
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bot-net

volumes:
  n8n_data:
  openhands_workspace: